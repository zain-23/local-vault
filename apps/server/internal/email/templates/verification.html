{{define "content"}}
<h1
  style="
    margin: 0 0 10px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #f5f2ed;
    text-align: center;
  "
>
  Verify your email
</h1>
<p
  style="
    margin: 0 0 8px;
    font-size: 14px;
    line-height: 1.55;
    color: #aaa39a;
    text-align: center;
  "
>
  Hi {{.Name}},
</p>
<p
  style="
    margin: 0 0 24px;
    font-size: 14px;
    line-height: 1.55;
    color: #aaa39a;
    text-align: center;
  "
>
  Confirm your email address to finish setting up your LocalVault account.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto">
  <tr>
    <td align="center" bgcolor="#e5b567" style="border-radius: 8px">
      <a
        href="{{.URL}}"
        style="
          display: inline-block;
          background-color: #e5b567;
          color: #1a1408;
          font-size: 14px;
          font-weight: 600;
          padding: 12px 22px;
          border-radius: 8px;
          text-decoration: none;
        "
        >Verify email</a
      >
    </td>
  </tr>
</table>
{{if .URL}}
<p
  style="
    margin: 20px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: #6c675f;
    text-align: center;
    word-break: break-all;
  "
>
  Or paste this link:<br />
  <a href="{{.URL}}" style="color: #aaa39a; text-decoration: underline"
    >{{.URL}}</a
  >
</p>
{{end}}
{{end}}
