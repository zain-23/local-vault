{{define "content"}}
<h1
  style="
    margin: 0 0 10px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #f5f2ed;
    text-align: center;
  "
>
  Collaborate on {{.Name}}
</h1>
<p
  style="
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.55;
    color: #aaa39a;
    text-align: center;
  "
>
  Sign in to the CLI with this email, then join with your invite code:
</p>
<p
  style="
    margin: 0 0 12px;
    font-family:
      ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono',
      'Courier New', monospace;
    font-size: 22px;
    letter-spacing: 0.1em;
    font-weight: 600;
    color: #e5b567;
    text-align: center;
  "
>
  {{.Code}}
</p>
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="margin: 0 auto 8px"
>
  <tr>
    <td
      align="center"
      style="
        background-color: #12110f;
        border: 1px solid #302c27;
        border-radius: 8px;
        padding: 12px 16px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
        font-size: 13px;
        color: #f5f2ed;
        text-align: center;
      "
    >
      lv join {{.Code}}
    </td>
  </tr>
</table>
<p
  style="
    margin: 16px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: #6c675f;
    text-align: center;
  "
>
  You must already be a member of the workspace. This code expires in 7 days.
</p>
{{end}}
