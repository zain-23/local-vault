name: release

# Production:  tag v1.2.3       (from main)     → stable release, prod SERVER_URL
# Development: tag v1.2.3-dev.1 (from develop)  → GitHub prerelease, dev SERVER_URL
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve environment
        id: env
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Semver with a hyphen suffix (v1.2.3-dev.1, v1.2.3-rc.1) → develop
          if [[ "$TAG" == *-* ]]; then
            echo "channel=develop" >> "$GITHUB_OUTPUT"
            echo "server_url=${{ vars.SERVER_URL_DEVELOPMENT || 'https://local-vault-dev.onrender.com' }}" >> "$GITHUB_OUTPUT"
          else
            echo "channel=production" >> "$GITHUB_OUTPUT"
            echo "server_url=${{ vars.SERVER_URL_PRODUCTION || vars.SERVER_URL || 'https://local-vault-1.onrender.com' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $TAG as channel=$([[ "$TAG" == *-* ]] && echo develop || echo production)"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ steps.env.outputs.server_url }}
