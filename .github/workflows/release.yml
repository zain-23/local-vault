name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required for GoReleaser to create the GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser needs full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The CLI's default server URL, injected into the binary at build
          # time. Override per-repo by setting a "SERVER_URL" repository
          # variable (Settings → Secrets and variables → Actions → Variables).
          SERVER_URL: ${{ vars.SERVER_URL || 'https://local-vault-1.onrender.com' }}
