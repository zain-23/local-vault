# Heroku Container Stack manifest
# Docs: https://devcenter.heroku.com/articles/build-docker-images-heroku-yml
setup:
  addons:
    - plan: cloudamqp:lemur
      as: CLOUDAMQP
  config:
    ENV: production

build:
  docker:
    # Must be at repo root: Heroku sets build context to the Dockerfile's directory
    web: Dockerfile


run:
  web: /server
  worker:
    command:
      - /worker
    image: web
